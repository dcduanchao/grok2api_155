    .provider-dialog{border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 70px rgba(10,16,22,.24)}.provider-dialog-head{padding:18px 20px}.provider-dialog-body{padding:20px}.provider-item,.favorite-item,.provider-model-options{border-radius:12px}.favorite-kind-tabs{border-radius:10px;background:#f3f4f6}.progress-fill{background:linear-gradient(90deg,#7c4dff,#6335e8)}.toast{border-radius:10px;background:var(--ink)}
    .prompt-tools{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}.prompt-tools .secondary{color:var(--accent);border-color:#e9dfff;background:var(--accent-soft);font-weight:600}.prompt-tools .secondary:hover{background:var(--accent-light)}.advanced-settings{margin:12px 0 20px;border-top:1px solid #f0f1f3}.advanced-settings summary{display:flex;align-items:center;justify-content:space-between;padding:12px 2px 0;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;list-style:none}.advanced-settings summary::-webkit-details-marker{display:none}.advanced-settings summary::after{content:"⌄";color:#9ca3af;font-size:15px;transition:transform 150ms ease}.advanced-settings[open] summary::after{transform:rotate(180deg)}.advanced-content{padding-top:14px}.advanced-content .prompt-ai-selects{margin-bottom:10px}.advanced-content .prompt-ai-actions{grid-template-columns:1fr}.advanced-content .prompt-sub-label{margin-top:14px}.advanced-content .prompt-source{margin-bottom:2px}#editFields .advanced-settings{margin-top:0}#imageFields>.advanced-settings{margin-top:-8px}.advanced-content>.check{margin-bottom:0}
    @media(max-width:1279px) and (min-width:901px){.shell{padding:22px 20px 48px}.grid{grid-template-columns:360px minmax(0,1fr);gap:16px}.controls,.result{padding:20px}.media-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.feature-item{padding:0 10px}}

    @media(max-width:390px){.row{grid-template-columns:1fr}.media-grid,.library .media-grid{grid-template-columns:1fr}.prompt-ai-actions{grid-template-columns:1fr}.upload-line{flex-wrap:wrap}.upload-line input{flex-basis:100%}}

<body>
<main class="shell">
  <header class="topbar"><div class="brand"><div class="mark">✦</div><div><h1>Grok Studio</h1><p>AI 图像创作工作台</p></div></div><div class="top-actions"><div class="health"><span class="dot" id="healthDot"></span><span id="healthText">检查服务中</span></div><button class="restart-comfy" id="restartComfy" type="button" title="重启 ComfyUI" aria-label="重启 ComfyUI"><span class="restart-icon" aria-hidden="true">↻</span><span class="restart-label">服务管理</span></button><button class="restart-comfy" id="logout" type="button" title="退出登录">退出</button></div></header>
  <div class="grid">
    <section class="panel controls">
      <div class="section-title"><h2>创建媒体</h2><span class="badge" id="modeBadge">图片</span></div>
      <div class="workspace-tabs"><button class="workspace-tab active" data-page="grok" type="button">Grok</button><button class="workspace-tab" data-page="comfy" type="button">ComfyUI</button><button class="workspace-tab" data-page="generic" type="button">通用生图</button></div>
      <div class="mode-tabs" id="grokModes"><button class="tab active" data-mode="image" type="button">图片</button><button class="tab" data-mode="masonry" type="button">瀑布流生图</button><button class="tab" data-mode="video" type="button">生视频</button></div>
      <div class="mode-tabs comfy-modes" id="comfyModes" hidden><button class="tab" data-mode="comfy" type="button">文生图</button><button class="tab" data-mode="comfyEdit" type="button">图片编辑</button><button class="tab" data-mode="comfyVideo" type="button">生视频</button></div>
      <div class="mode-tabs generic-modes" id="genericModes" hidden><button class="tab" data-mode="generic" type="button">通用生图</button></div>
      <form id="form">
        <div class="field" id="modelField"><label>模型 <span class="hint">必填</span></label><input id="model" value="grok-imagine-image" required></div>
        <div class="field"><div class="prompt-heading"><label>提示词 Prompt <span class="hint">核心创作描述</span></label><button class="secondary prompt-favorite-open" id="openPromptFavorites" type="button" title="打开提示词收藏"><span aria-hidden="true">☆</span><span>收藏提示词</span></button></div><textarea id="prompt" placeholder="描述你想生成的画面，例如：未来城市，赛博朋克风格，夜晚霓虹灯光" required></textarea><div class="prompt-tools"><button class="secondary" id="expandPrompt" type="button">✦ AI 扩展 Prompt</button><span class="hint">让描述更丰富</span></div><details class="advanced-settings"><summary>Prompt 高级设置</summary><div class="advanced-content"><div class="prompt-ai-selects"><select id="promptProvider" aria-label="提示词扩展供应商"><option value="">选择扩展供应商</option></select><select id="promptModel" aria-label="提示词扩展模型"><option value="">选择聊天模型</option></select><button class="secondary" id="promptProviderManage" type="button" title="管理供应商">配置</button></div><div class="prompt-ai-actions"><button class="secondary" id="expandNsfwPrompt" type="button">NSFW 扩展</button></div><div class="prompt-sub-label"><span>扩展提示词</span><span class="hint">可继续修改</span></div><textarea id="expandedPrompt" placeholder="点击 AI 扩展 Prompt 生成，也可以手动填写"></textarea><div class="prompt-source" role="radiogroup" aria-label="生成时使用的提示词"><label><input type="radio" name="promptSource" value="original" checked><span>使用原提示词</span></label><label><input type="radio" name="promptSource" value="expanded"><span>使用扩展提示词</span></label></div></div></details></div>
        <div id="editFields"><details class="advanced-settings"><summary>图片编辑</summary><div class="advanced-content"><div class="field"><label>原图公共 URL <span class="hint">填写后自动进入编辑模式</span></label><div class="upload-line"><input id="imageUrl" placeholder="留空则生成图片"><button class="secondary" id="copyImageUrl" type="button">复制</button><label class="secondary" style="display:grid;place-items:center;cursor:pointer">上传<input id="imageFile" type="file" accept="image/*" hidden></label></div></div></div></details></div>
        <div id="imageFields"><div class="row"><div class="field"><label>生成数量</label><input id="count" type="number" min="1" max="4" value="1"></div><div class="field"><label>画面比例</label><select id="ratio"><option>1:1</option><option>16:9</option><option>9:16</option><option>4:3</option><option>3:2</option></select></div></div><details class="advanced-settings"><summary>更多生成参数</summary><div class="advanced-content"><div class="field"><label>分辨率</label><select id="resolution"><option>1k</option><option>2k</option></select></div><label class="check"><input id="stream" type="checkbox"> 使用扩展流式响应（图片）</label></div></details></div>
        <div id="videoFields" hidden><div class="row"><div class="field"><label>时长（秒）</label><input id="duration" type="number" min="1" max="60" value="8"></div><div class="field"><label>比例</label><select id="videoRatio"><option>16:9</option><option>9:16</option><option>1:1</option></select></div></div><div class="field"><label>分辨率</label><select id="videoResolution"><option>720p</option><option>480p</option><option>1080p</option></select></div><div class="field"><label>首帧图片 URL <span class="hint">可选</span></label><input id="videoImage" placeholder="https://..."></div></div>
        <div id="comfyFields" hidden><div id="comfyEditFields" hidden><div class="field"><label>输入图片 <span class="hint">必填</span></label><div class="upload-line"><input id="comfyEditName" readonly placeholder="选择需要修改的图片"><label class="secondary" style="display:grid;place-items:center;cursor:pointer">选择<input id="comfyEditFile" type="file" accept="image/*" hidden></label></div></div></div><div id="comfyVideoFields" hidden><div class="field"><label>首帧图片 <span class="hint">可选，有图片时自动图生视频</span></label><div class="upload-line"><input id="comfyVideoName" readonly placeholder="未选择图片时使用文生视频"><label class="secondary" style="display:grid;place-items:center;cursor:pointer">选择<input id="comfyVideoFile" type="file" accept="image/*" hidden></label><button class="secondary" id="clearComfyVideoImage" type="button">清除</button></div></div><div class="row"><div class="field"><label>宽高比</label><select id="comfyVideoRatio"><option>1:1 (Square)</option><option>2:3 (Portrait Photo)</option><option>3:2 (Photo)</option><option>3:4 (Portrait Standard)</option><option>4:3 (Standard)</option><option selected>9:16 (Portrait Widescreen)</option><option>16:9 (Widescreen)</option><option>21:9 (Ultrawide)</option></select></div><div class="field"><label>百万像素</label><select id="comfyVideoMegapixels"><option>0.2</option><option>0.3</option><option selected>0.4</option><option>0.5</option><option>0.6</option><option>0.7</option><option>0.8</option><option>0.9</option><option>0.98</option><option>1.0</option><option>1.2</option><option>1.5</option><option>1.8</option><option>2.0</option></select></div></div><div class="field"><label>时长（秒） <span class="hint">最低 5 秒</span></label><input id="comfyVideoDuration" type="number" min="5" max="60" step="0.5" value="5"></div></div><div class="field" id="comfyNegativeField"><label>负向提示词 <span class="hint">可为空</span></label><textarea id="comfyNegative" placeholder="例如：模糊，低质量，变形"></textarea></div><div class="row" id="comfySizeFields"><div class="field"><label>宽度</label><input id="comfyWidth" type="number" min="1" max="8192" value="768"></div><div class="field"><label>高度</label><input id="comfyHeight" type="number" min="1" max="8192" value="1024"></div></div></div>
        <div id="genericFields" hidden><div class="provider-toolbar"><div class="field"><label>供应商</label><select id="genericProvider"></select></div><button class="secondary" id="manageProviders" type="button">管理</button></div><div class="field"><label>模型</label><select id="genericModel"></select></div><div class="field" id="genericEditSource"><label>输入图片 <span class="hint">可选，有图片时自动编辑</span></label><div class="upload-line"><input id="genericEditName" readonly placeholder="未选择图片时生成新图片"><label class="secondary" style="display:grid;place-items:center;cursor:pointer">选择<input id="genericEditFile" type="file" accept="image/*" hidden></label><button class="secondary" id="clearGenericImage" type="button">清除</button></div><input id="genericImageUrl" placeholder="也可以填写 https:// 图片地址" style="margin-top:8px"></div><div class="row"><div class="field"><label>尺寸</label><select id="genericSize"><option>1024x1024</option><option>1536x1024</option><option>1024x1536</option></select></div><div class="field"><label>数量</label><input id="genericCount" type="number" min="1" max="4" value="1"></div></div></div>
      </form>
        <div class="submit-dock"><button class="primary" id="submit" type="submit" form="form">生成图片</button></div>
    </section>
    <section class="panel result"><div class="result-head"><div><h2>创作结果</h2><p id="resultHint">生成后的图片会显示在这里</p></div><span class="badge" id="resultCount">0 项</span></div><div id="results" class="empty"><div class="empty-state"><div class="empty-icon" aria-hidden="true">✦</div><strong>还没有生成任何图片</strong><span>输入你的创意想法，让 AI 帮你实现</span><div class="empty-suggestions" aria-label="示例提示词"><span>电影感城市夜景</span><span>柔和光线人物肖像</span><span>极简产品摄影</span></div></div></div><div class="feature-strip" aria-label="产品能力"><div class="feature-item"><span class="feature-icon" aria-hidden="true">◇</span><div><strong>强大模型</strong><span>生成高质量图像</span></div></div><div class="feature-item"><span class="feature-icon" aria-hidden="true">✦</span><div><strong>AI 智能扩展</strong><span>自动优化提示词</span></div></div><div class="feature-item"><span class="feature-icon" aria-hidden="true">⌗</span><div><strong>多种比例</strong><span>适配多种创作场景</span></div></div></div></section>
  </div>
  <section class="panel library"><div class="library-head"><h2>素材库</h2><button class="danger" id="clearCurrent" type="button">清空全部</button></div><div class="filters"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="image">生成图片</button><button class="filter" data-filter="video">视频</button><button class="filter" data-filter="upload">ImgBB 上传</button><button class="danger" id="deleteSelected" type="button" disabled>删除选中</button></div><div id="libraryGrid"><div class="status">正在读取历史记录…</div></div></section>
</main><div class="toast" id="toast"></div><div class="provider-modal" id="providerModal" role="dialog" aria-modal="true" aria-label="供应商管理"><div class="provider-dialog"><div class="provider-dialog-head"><h2>供应商管理</h2><button class="secondary" id="closeProviders" type="button">关闭</button></div><div class="provider-dialog-body"><div><input id="providerId" type="hidden"><div class="field"><label>名称</label><input id="providerName" placeholder="OpenAI"></div><div class="field"><label>兼容 API 地址</label><input id="providerBaseUrl" placeholder="https://api.openai.com"></div><div class="field"><label>API Key <span class="hint">编辑时留空保留原 Key</span></label><input id="providerApiKey" type="password" autocomplete="new-password" placeholder="不会显示已保存的 Key"></div><div class="field"><label>本地模型 <span class="hint">勾选后随供应商保存</span></label><div class="provider-model-toolbar"><button class="secondary" id="fetchProviderModels" type="button">从远端读取</button><span class="provider-model-status" id="providerModelStatus">尚未读取模型</span></div><div class="provider-model-options" id="providerModelChoices"><div class="status">填写地址和 Key 后读取模型</div></div></div><div class="provider-form-actions"><button class="primary" id="saveProvider" type="button">新增供应商</button><button class="secondary" id="resetProvider" type="button">取消编辑</button></div></div><div><div class="provider-list" id="providerList"></div></div></div></div></div><div class="provider-modal" id="promptFavoritesModal" role="dialog" aria-modal="true" aria-label="提示词收藏"><div class="provider-dialog"><div class="provider-dialog-head"><h2>提示词收藏</h2><button class="secondary" id="closePromptFavorites" type="button">关闭</button></div><div class="provider-dialog-body"><div><div class="favorite-kind-tabs"><button class="favorite-kind active" data-favorite-kind="image" type="button">生图收藏</button><button class="favorite-kind" data-favorite-kind="video" type="button">视频收藏</button></div><input id="favoriteId" type="hidden"><div class="field"><label>名称 <span class="hint">留空自动截取提示词</span></label><input id="favoriteName" maxlength="100" placeholder="例如：电影感人像"></div><div class="field"><label>提示词</label><textarea id="favoritePrompt" maxlength="20000" placeholder="输入要收藏的提示词"></textarea></div><div class="provider-form-actions"><button class="primary" id="savePromptFavorite" type="button">新增收藏</button><button class="secondary" id="resetPromptFavorite" type="button">取消编辑</button></div></div><div><div class="group-title"><span id="favoriteListTitle">生图收藏</span><span class="favorite-count" id="favoriteCount">0 条</span></div><div class="favorite-list" id="promptFavoriteList"><div class="status">正在读取收藏…</div></div></div></div></div></div><div class="preview-modal" id="previewModal" role="dialog" aria-modal="true" aria-label="媒体预览"><button class="preview-close" id="closePreview" type="button" aria-label="关闭预览">×</button><div class="preview-modal-content" id="previewContent"></div></div>
<script>
  const $=id=>document.getElementById(id); let page='grok', mode='image', library=[], comfyEditImage=null, comfyVideoImage=null, genericEditImage=null, imageProviders=[], promptFavorites=[], favoriteKind='image';
  $('genericSize').innerHTML=['512x512','768x768','1024x1024','1024x768','768x1024','1536x1024','1024x1536','1280x720','720x1280','1920x1080','1080x1920'].map(size=>`<option${size==='1024x1024'?' selected':''}>${size}</option>`).join('');
  let genericWaitTimer=null;
  function hasGenericImage(){return Boolean(genericEditImage||$('genericImageUrl').value.trim())}
  function hasPromptReferenceImage(){if(mode==='image')return Boolean($('imageUrl').value.trim());if(mode==='video')return Boolean($('videoImage').value.trim());if(mode==='comfyEdit')return Boolean(comfyEditImage);if(mode==='comfyVideo')return Boolean(comfyVideoImage);if(mode==='generic'||mode==='genericEdit')return hasGenericImage();return false}
  function updateGenericAction(){if(page!=='generic')return;const editing=hasGenericImage();$('submit').textContent=editing?'编辑图片':'生成图片';$('resultHint').textContent=editing?'检测到输入图片，将调用编辑接口':'未提供输入图片，将调用生成接口'}
  function startGenericWait(){const provider=imageProviders.find(x=>x.id===$('genericProvider').value);const started=Date.now();$('results').className='status';$('results').innerHTML=`<div class="progress-box"><strong>${hasGenericImage()?'正在提交图片编辑':'正在生成图片'}</strong><div class="progress-line"><div class="progress-fill indeterminate"></div></div><div class="progress-label"><span>${escapeHtml(provider?.name||'供应商')} · ${escapeHtml($('genericModel').value||'模型')}</span><span id="genericWaitTime">已等待 0 秒</span></div></div>`;$('resultCount').textContent='处理中';$('resultHint').textContent='请求已发送，正在等待供应商返回结果';clearInterval(genericWaitTimer);genericWaitTimer=setInterval(()=>{const el=$('genericWaitTime');if(el)el.textContent=`已等待 ${Math.floor((Date.now()-started)/1000)} 秒`},1000)}
  function stopGenericWait(){clearInterval(genericWaitTimer);genericWaitTimer=null}
  function requestParams(options={}){if(!options.body)return {};if(typeof options.body==='string'){try{return JSON.parse(options.body)}catch{return {body:options.body.slice(0,1200)}}}return {body:`<binary ${options.body.byteLength||options.body.size||0} bytes>`}}
  async function apiFetch(url,options={}){const genericRequest=url==='/api/images/generations'||url==='/api/images/edits';if(genericRequest)startGenericWait();console.log('[api.request]',url,requestParams(options));try{const response=await window.fetch(url,options);if(response.status===401&&!url.startsWith('/api/auth/')){window.location.replace('/');throw Error('登录已过期')}try{const body=await response.clone().text();console.log('[api.response]',url,response.status,body.length>1200?body.slice(0,1200)+'…':body)}catch(error){console.log('[api.response]',url,response.status,'<unreadable>',error)}return response}finally{if(genericRequest)stopGenericWait()}}
  function toast(message){const el=$('toast');el.textContent=message;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),3200)}
  function responseError(body,fallback='请求失败'){if(typeof body?.error==='string')return body.code?`${body.error}（${body.code}）`:body.error;if(body?.error?.message)return body.code?`${body.error.message}（${body.code}）`:body.error.message;if(typeof body?.message==='string')return body.code?`${body.message}（${body.code}）`:body.message;return fallback}
  function selectedPrompt(){const source=document.querySelector('input[name="promptSource"]:checked')?.value;return (source==='expanded'?$('expandedPrompt').value:$('prompt').value).trim()}
  function setPage(next){page=next;document.querySelectorAll('.workspace-tab').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('grokModes').hidden=page!=='grok';$('comfyModes').hidden=page!=='comfy';$('genericModes').hidden=page!=='generic';setMode(page==='comfy'?(mode==='comfyEdit'||mode==='comfyVideo'?mode:'comfy'):page==='generic'?'generic':(mode==='video'||mode==='masonry'?mode:'image'))}

  $('clearGenericImage').onclick=()=>{genericEditImage=null;$('genericEditFile').value='';$('genericEditName').value='';$('genericImageUrl').value='';$('genericImageUrl').hidden=false;mode='generic';updateGenericAction();toast('输入图片已清除，将使用生成接口')};
  async function pollVideo(requestId){for(let i=0;i<60;i++){await new Promise(r=>setTimeout(r,3000));try{const r=await apiFetch('/api/videos/'+encodeURIComponent(requestId));const j=await r.json();if(!r.ok||j.error){const message=responseError(j,'视频状态获取失败');$('results').innerHTML=`<div class="status">${message}</div>`;toast(message);return}const progress=Math.max(0,Math.min(100,Number(j.progress)||0));if(j.status==='done'&&j.video?.url){$('results').className='media-grid';$('results').innerHTML=card({id:j.media_id,kind:'video',url:j.video.url,prompt:'视频生成结果'});$('resultCount').textContent='1 项';bindPreviews();toast('视频生成完成');await refresh();return}if(j.status==='failed'){ $('results').innerHTML='<div class="status">视频生成失败</div>';await refresh();return }$('results').className='status';$('results').innerHTML=`<div class="progress-box"><strong>视频生成中</strong><div class="progress-line"><div class="progress-fill" style="width:${progress}%"></div></div><div class="progress-label"><span>${j.status||'pending'}</span><span>${progress}%</span></div></div>`;$('resultHint').textContent=`视频任务进度 ${progress}%`}catch{ return }} }
  async function pollComfyTask(taskId,submittedPrompt){for(let i=0;i<1200;i++){await new Promise(r=>setTimeout(r,1500));try{const r=await apiFetch('/api/comfyui/tasks/'+encodeURIComponent(taskId));const j=await r.json();if(!r.ok||j.error){const message=responseError(j,'ComfyUI 任务查询失败');$('results').innerHTML=`<div class="status">${message}</div>`;toast(message);return}if(j.status==='done'&&j.outputs?.length){const data=j.outputs.map(x=>({id:x.media_id,kind:x.type==='video'?'video':'image',url:x.url,prompt:submittedPrompt}));$('results').className='media-grid';$('results').innerHTML=data.map(card).join('');$('resultCount').textContent=data.length+' 项';bindPreviews();toast(data.some(x=>x.kind==='video')?'ComfyUI 视频生成完成':'ComfyUI 图片生成完成');await refresh();return}if(j.status==='failed'||j.status==='timeout'){const message=responseError(j,'ComfyUI 任务失败');$('results').innerHTML=`<div class="status">${message}</div>`;toast(message);await refresh();return}$('results').className='status';$('results').innerHTML='<div class="progress-box"><strong>ComfyUI 正在生成</strong><div class="progress-line"><div class="progress-fill" style="width:20%"></div></div><div class="progress-label"><span>'+ (j.status||'pending') +'</span><span>处理中</span></div></div>';$('resultHint').textContent='ComfyUI 任务执行中'}catch(error){$('results').innerHTML=`<div class="status">${error.message}</div>`;return}}toast('ComfyUI 任务查询超时')}
  $('form').addEventListener('submit',event=>{if(selectedPrompt())return;event.preventDefault();event.stopImmediatePropagation();const expanded=document.querySelector('input[name="promptSource"]:checked')?.value==='expanded';toast(expanded?'扩展提示词为空，请填写或切换到原提示词':'请填写原提示词');$(expanded?'expandedPrompt':'prompt').focus()},true);
  $('form').onsubmit=async e=>{e.preventDefault();const button=$('submit');button.disabled=true;$('results').className='status';$('results').textContent='正在请求上游服务…';const payload={model:$('model').value.trim(),prompt:selectedPrompt()};if(mode==='comfy'||mode==='comfyEdit'){Object.assign(payload,{workflow:mode==='comfyEdit'?'image_edit':'text_to_image',negative_prompt:$('comfyNegative').value.trim()});if(mode==='comfyEdit'){if(!comfyEditImage){$('results').className='empty';$('results').innerHTML='<div><strong>缺少输入图片</strong><span>请选择一张需要修改的图片</span></div>';toast('请选择输入图片');button.disabled=false;return}payload.image=comfyEditImage}else{Object.assign(payload,{width:Number($('comfyWidth').value),height:Number($('comfyHeight').value)})}try{const r=await apiFetch('/api/comfyui/generations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const j=await r.json();if(!r.ok)throw Error(responseError(j));$('results').innerHTML='<div class="status"><div class="progress-box"><strong>ComfyUI 任务已提交</strong><div class="progress-line"><div class="progress-fill" style="width:10%"></div></div><div class="progress-label"><span>'+j.prompt_id+'</span><span>排队中</span></div></div></div>';$('resultCount').textContent='处理中';toast('ComfyUI 任务已提交');if(j.task_id)pollComfyTask(j.task_id,payload.prompt);return}catch(err){$('results').className='empty';$('results').innerHTML=`<div><strong>请求未完成</strong><span>${err.message}</span></div>`;toast(err.message);return}finally{button.disabled=false}}if(mode==='video'){Object.assign(payload,{duration:Number($('duration').value),aspect_ratio:$('videoRatio').value,resolution:$('videoResolution').value});if($('videoImage').value.trim())payload.image={url:$('videoImage').value.trim()}}else{Object.assign(payload,{n:Number($('count').value),aspect_ratio:$('ratio').value,resolution:$('resolution').value,response_format:'url',stream:$('stream').checked});if($('imageUrl').value.trim())payload.image={url:$('imageUrl').value.trim()}}const imageEdit=mode==='image'&&Boolean($('imageUrl').value.trim());const endpoint=mode==='video'?'/v1/videos/generations':imageEdit?'/v1/images/edits':'/v1/images/generations';try{const r=await apiFetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const j=await r.json();if(!r.ok)throw Error(responseError(j));if(mode==='video'){const requestId=j.request_id||'';$('results').innerHTML=`<div class="status"><div class="progress-box"><strong>视频任务已创建</strong><div class="progress-line"><div class="progress-fill" style="width:0%"></div></div><div class="progress-label"><span>${requestId||'已提交'}</span><span>0%</span></div></div></div>`;if(requestId)pollVideo(requestId)}else{const data=(j.data||[]).map(x=>({kind:'image',url:x.url,data_uri:x.b64_json?'data:image/png;base64,'+x.b64_json:'',prompt:payload.prompt}));$('results').className='media-grid';$('results').innerHTML=data.length?data.map(card).join(''):'<div class="status">上游未返回可展示的媒体</div>';$('resultCount').textContent=data.length+' 项';bindPreviews()}toast(mode==='video'?'视频任务已提交':imageEdit?'图片编辑完成':'图片生成完成');await refresh()}catch(err){$('results').className='empty';$('results').innerHTML=`<div><strong>请求未完成</strong><span>${err.message}</span></div>`;toast(err.message)}finally{button.disabled=false}};
  function escapeHtml(value){return String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
  function masonryEntry(item,index){if(item.error)return `<article class="media-card"><div class="masonry-error"><strong>第 ${index+1} 张生成失败</strong><span>${escapeHtml(item.error)}</span></div></article>`;return card(item)}
  async function runMasonry(event){event.preventDefault();const button=$('submit');button.disabled=true;const prompt=selectedPrompt();const payload={model:$('model').value.trim(),prompt,n:1,aspect_ratio:$('ratio').value,resolution:$('resolution').value,response_format:'url',stream:false};const entries=Array(6).fill(null);let done=0,success=0;const render=()=>{$('results').className='masonry-grid';const visible=entries.map((item,index)=>item?masonryEntry(item,index):'').join('');$('results').innerHTML=visible||'<div class="status">正在启动 6 个独立请求…</div>';$('resultCount').textContent=`${success} 成功 / ${done} 完成`;$('resultHint').textContent=`瀑布流任务：${done} / 6 完成`;bindPreviews()};render();const requestOne=async index=>{try{const response=await apiFetch('/v1/images/generations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const body=await response.json();if(!response.ok)throw Error(responseError(body));const media=(body.data||[])[0];if(!media)throw Error('上游未返回图片');entries[index]={kind:'image',url:media.url,data_uri:media.b64_json?'data:image/png;base64,'+media.b64_json:'',prompt};success++}catch(error){entries[index]={error:error.message||'请求失败'}}finally{done++;render()}};await Promise.all(Array.from({length:6},(_,index)=>requestOne(index)));button.disabled=false;toast(`瀑布流完成：${success} 成功，${6-success} 失败`);await refresh()}
  const defaultSubmit=$('form').onsubmit;$('form').onsubmit=event=>mode==='masonry'?runMasonry(event):defaultSubmit(event);
  $('form').addEventListener('submit',async event=>{if(mode!=='comfyVideo')return;event.preventDefault();event.stopImmediatePropagation();const button=$('submit');button.disabled=true;$('results').className='status';$('results').innerHTML='<div class="progress-box"><strong>ComfyUI 视频任务正在提交</strong><div class="progress-line"><div class="progress-fill indeterminate"></div></div><div class="progress-label"><span>MiniMax H3</span><span>请稍候</span></div></div>';$('resultCount').textContent='处理中';const payload={workflow:comfyVideoImage?'image_to_video':'text_to_video',prompt:selectedPrompt(),aspect_ratio:$('comfyVideoRatio').value,megapixels:Number($('comfyVideoMegapixels').value),duration:Number($('comfyVideoDuration').value)};if(comfyVideoImage)payload.image=comfyVideoImage;try{const r=await apiFetch('/api/comfyui/generations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const j=await r.json();if(!r.ok)throw Error(responseError(j));$('results').innerHTML='<div class="status"><div class="progress-box"><strong>ComfyUI 视频任务已提交</strong><div class="progress-line"><div class="progress-fill" style="width:10%"></div></div><div class="progress-label"><span>'+j.prompt_id+'</span><span>排队中</span></div></div></div>';toast(comfyVideoImage?'图生视频任务已提交':'文生视频任务已提交');if(j.task_id)pollComfyTask(j.task_id,payload.prompt)}catch(error){$('results').className='empty';$('results').innerHTML=`<div><strong>请求未完成</strong><span>${error.message}</span></div>`;toast(error.message)}finally{button.disabled=false}},true);
  $('form').addEventListener('submit',()=>{if(page==='generic')mode=hasGenericImage()?'genericEdit':'generic'},true);
  $('form').addEventListener('submit',async event=>{if(mode!=='generic'&&mode!=='genericEdit')return;event.preventDefault();event.stopImmediatePropagation();const button=$('submit');button.disabled=true;const payload={provider_id:$('genericProvider').value,model:$('genericModel').value,prompt:selectedPrompt(),n:Number($('genericCount').value),size:$('genericSize').value};if(mode==='genericEdit'){payload.image={url:$('genericImageUrl').value.trim()};if(!payload.image.url){toast('编辑时需要图片 URL');button.disabled=false;return}}try{const endpoint=mode==='genericEdit'?'/api/images/edits':'/api/images/generations';const response=await apiFetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const body=await response.json();if(!response.ok)throw Error(responseError(body));const data=(body.data||[]).map(x=>({kind:'image',url:x.url,data_uri:x.b64_json?'data:image/png;base64,'+x.b64_json:'',prompt:payload.prompt}));$('results').className='media-grid';$('results').innerHTML=data.length?data.map(card).join(''):'<div class="status">供应商未返回可展示的图片</div>';$('resultCount').textContent=data.length+' 项';bindPreviews();toast('通用生图完成');await refresh()}catch(error){$('results').className='empty';$('results').innerHTML=`<div><strong>请求未完成</strong><span>${error.message}</span></div>`;toast(error.message)}finally{button.disabled=false}},true);
  $('restartComfy').onclick=async()=>{if(!window.confirm('确定重启 ComfyUI 吗？正在执行的任务会被中断。'))return;const button=$('restartComfy');button.disabled=true;$('healthDot').classList.remove('on');$('healthText').textContent='ComfyUI 重启中';try{const response=await apiFetch('/api/comfyui/restart',{method:'POST'});const body=await response.json();if(!response.ok)throw Error(responseError(body,'ComfyUI 重启失败'));toast('ComfyUI 已开始重启');await new Promise(resolve=>setTimeout(resolve,3000));for(let attempt=0;attempt<30;attempt++){try{const health=await apiFetch('/api/comfyui/health');if(health.ok){$('healthDot').classList.add('on');$('healthText').textContent='ComfyUI 已恢复';toast('ComfyUI 已恢复在线');return}}catch{}await new Promise(resolve=>setTimeout(resolve,2000))}$('healthText').textContent='等待 ComfyUI 恢复';toast('重启已提交，ComfyUI 尚未恢复')}catch(error){$('healthText').textContent='ComfyUI 重启失败';toast(error.message)}finally{button.disabled=false}};
  $('logout').onclick=async()=>{try{await window.fetch('/api/auth/logout',{method:'POST'})}finally{window.location.replace('/')}};
  $('closePreview').onclick=()=>{$('previewModal').classList.remove('open');$('previewContent').innerHTML=''};$('previewModal').onclick=e=>{if(e.target===$('previewModal'))$('closePreview').click()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('promptFavoritesModal').classList.contains('open'))$('closePromptFavorites').click();else if($('providerModal').classList.contains('open'))$('closeProviders').click();else $('closePreview').click()}});
  apiFetch('/api/health').then(r=>r.json()).then(j=>{$('healthDot').classList.toggle('on',j.ok);$('healthText').textContent=j.configured?'服务在线':'服务在线 · 待配置上游'}).catch(()=>{$('healthText').textContent='服务不可用'});loadProviders();refresh();
