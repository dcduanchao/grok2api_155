<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grok Studio | 图片与视频工作台</title>
  <style>
    :root{--ink:#17202a;--muted:#687483;--line:#dfe5ea;--paper:#f7f9fb;--card:#fff;--accent:#e85d3f;--accent-2:#f19a53;--ok:#198754;--shadow:0 18px 50px rgba(28,44,60,.09)}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    button,input,textarea,select{font:inherit} button{cursor:pointer;border:0} .shell{max-width:1240px;margin:0 auto;padding:28px 22px 60px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:32px}.brand{display:flex;align-items:center;gap:13px}.mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;display:grid;place-items:center;font-size:22px;font-weight:800;box-shadow:0 7px 17px #e85d3f44}.brand h1{font-size:20px;line-height:1.1;margin:0}.brand p{margin:4px 0 0;color:var(--muted);font-size:12px}.top-actions,.health{display:flex;align-items:center;gap:8px}.health{color:var(--muted);font-size:13px}.restart-comfy{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:7px 10px;font-size:12px}.restart-comfy:disabled{opacity:.5;cursor:wait}.restart-icon{font-size:16px;line-height:1}.dot{width:8px;height:8px;border-radius:99px;background:#adb7bf}.dot.on{background:var(--ok);box-shadow:0 0 0 4px #19875418}.grid{display:grid;grid-template-columns:minmax(290px,390px) 1fr;gap:23px;align-items:start}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.controls{padding:22px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:0 0 18px}.section-title h2{font-size:17px;margin:0}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:#f0f3f5;border-radius:10px;padding:4px;margin-bottom:20px}.tab{background:transparent;padding:9px 4px;border-radius:7px;color:var(--muted);font-size:13px}.tab.active{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 2px 7px #17202a14}.field{margin-bottom:14px}.field label{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:700;color:#4f5b67;margin-bottom:6px}.hint{font-size:11px;color:#9ba5ad;font-weight:400}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#fcfdfe;border-radius:9px;padding:10px 11px;color:var(--ink);outline:none;transition:border .15s,box-shadow .15s}.field textarea{resize:vertical;min-height:96px}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px #e85d3f15}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.check{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin:7px 0 16px}.check input{accent-color:var(--accent)}.primary{width:100%;border-radius:9px;padding:11px 14px;background:var(--accent);color:#fff;font-weight:700;box-shadow:0 7px 14px #e85d3f2b}.primary:disabled{opacity:.55;cursor:wait}.secondary{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:8px 11px;font-size:12px}.upload-line{display:flex;gap:8px}.upload-line input{flex:1}.result{min-height:550px;padding:22px}.result-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:17px}.result-head h2{font-size:17px;margin:0}.result-head p{margin:4px 0 0;color:var(--muted);font-size:12px}.badge{background:#fff3ed;color:#b64a31;border-radius:99px;padding:4px 9px;font-size:11px;font-weight:700}.empty{min-height:450px;display:grid;place-items:center;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.empty strong{display:block;color:var(--ink);margin-bottom:5px}.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.media-card{overflow:hidden;border:1px solid var(--line);border-radius:12px;background:#fff}.media-card .visual{background:#edf1f4;aspect-ratio:1/1;display:grid;place-items:center;overflow:hidden}.media-card img,.media-card video{width:100%;height:100%;object-fit:cover}.media-card video{background:#10161b}.media-card .meta{padding:11px}.media-card .meta p{font-size:12px;margin:0 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.url-line{display:flex;gap:6px}.url-line input{min-width:0;flex:1;border:1px solid var(--line);border-radius:6px;padding:5px 7px;font-size:10px;color:var(--muted)}.copy{background:#17202a;color:white;border-radius:6px;padding:0 8px;font-size:11px}.status{font-size:12px;color:var(--muted);padding:30px;text-align:center}.toast{position:fixed;right:20px;bottom:20px;background:#17202a;color:#fff;padding:11px 15px;border-radius:9px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none;font-size:13px}.toast.show{opacity:1;transform:translateY(0)}.library{margin-top:23px;padding:22px}.library-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.library h2{font-size:17px;margin:0}.filters{display:flex;gap:7px}.filter{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 10px;color:var(--muted);font-size:11px}.filter.active{background:var(--ink);border-color:var(--ink);color:#fff}
    .tabs{grid-template-columns:repeat(2,1fr)}.filters{align-items:center;flex-wrap:wrap}.filter,.danger{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 10px;color:var(--muted);font-size:11px}.danger{border-color:#f0b5aa;color:#bc4936}.danger:disabled{opacity:.45;cursor:not-allowed}.library-group{margin-top:19px}.group-title{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:10px;color:#4f5b67}.group-count{font-size:11px;color:#9ba5ad;font-weight:400}.media-card{position:relative}.select-media{position:absolute;top:9px;left:9px;width:17px;height:17px;z-index:2;accent-color:var(--accent)}.visual-link{display:block;width:100%;height:100%;color:inherit;text-decoration:none;cursor:zoom-in}.delete-one{border:0;background:transparent;color:#bc4936;font-size:11px;padding:0}.meta-foot{display:flex;align-items:center;justify-content:space-between;margin-top:7px}.library .media-grid{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}.library .media-card .meta{padding:8px}.library .media-card .meta p{font-size:11px;margin-bottom:6px}.library .url-line input{font-size:9px;padding:4px}.library .copy{font-size:10px;padding:0 6px}
    .tabs{grid-template-columns:repeat(3,1fr)}.workspace-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#edf1f4;border-radius:12px;padding:5px;margin-bottom:10px}.workspace-tab{padding:11px 12px;border-radius:9px;background:transparent;color:var(--muted);font-weight:700;font-size:13px}.workspace-tab.active{background:var(--ink);color:#fff;box-shadow:0 3px 8px #17202a22}.mode-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:#f5f7f8;border-radius:10px;padding:4px;margin-bottom:20px}.mode-tabs.comfy-modes{grid-template-columns:repeat(3,1fr)}.mode-tabs.generic-modes{grid-template-columns:1fr}.mode-tabs[hidden]{display:none}.provider-toolbar{display:flex;align-items:end;gap:8px}.provider-toolbar .field{flex:1}.provider-modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(10,16,22,.64)}.provider-modal.open{display:flex}.provider-dialog{width:min(760px,96vw);max-height:90vh;overflow:auto;background:#fff;border-radius:10px;box-shadow:0 24px 70px #0004}.provider-dialog-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}.provider-dialog-head h2{font-size:16px;margin:0}.provider-dialog-body{display:grid;grid-template-columns:minmax(250px,1fr) minmax(260px,1fr);gap:18px;padding:18px}.provider-form-actions,.provider-actions{display:flex;gap:7px}.provider-list{display:grid;gap:8px}.provider-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:12px}.provider-item strong,.provider-item span{display:block}.provider-item span{color:var(--muted);font-size:10px;word-break:break-all}.provider-actions button{background:transparent;color:var(--ink);font-size:11px}.provider-actions .provider-delete{color:#bc4936}.library>.filters{margin-bottom:16px}.masonry-grid{column-count:3;column-gap:14px}.masonry-grid .media-card{display:inline-block;width:100%;margin:0 0 14px;break-inside:avoid}.masonry-error{padding:18px;background:#fff7f4;border:1px solid #f1c7bd;border-radius:12px;color:#a83f2f;font-size:12px}.masonry-error strong{display:block;margin-bottom:6px}.masonry-error span{display:block;word-break:break-word}
    .preview-modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(10,16,22,.82)}.preview-modal.open{display:flex}.preview-modal-content{max-width:min(92vw,1100px);max-height:88vh;display:flex;align-items:center;justify-content:center}.preview-modal-content img,.preview-modal-content video{display:block;max-width:92vw;max-height:88vh;object-fit:contain;border-radius:10px;background:#10161b}.preview-close{position:absolute;top:16px;right:20px;color:#fff;background:transparent;font-size:29px;line-height:1;padding:4px 10px}
    .progress-box{width:min(420px,90%);margin:0 auto;text-align:left}.progress-line{height:8px;border-radius:99px;background:#edf1f4;overflow:hidden;margin:12px 0 7px}.progress-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .3s}.progress-fill.indeterminate{width:38%;animation:waiting-slide 1.25s ease-in-out infinite}.progress-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}@keyframes waiting-slide{0%{transform:translateX(-110%)}50%{transform:translateX(90%)}100%{transform:translateX(270%)}}
    @media(max-width:1000px){.masonry-grid{column-count:2}}@media(max-width:800px){.shell{padding:18px 13px 40px}.topbar{margin-bottom:21px}.grid{grid-template-columns:1fr}.result{min-height:380px}.empty{min-height:280px}.library{margin-top:15px;padding:16px}.library-head{align-items:center;gap:12px;flex-direction:row}.brand p{display:none}.masonry-grid{column-count:2}.provider-dialog-body{grid-template-columns:1fr}}@media(max-width:560px){.topbar{align-items:flex-start}.top-actions{flex-direction:column;align-items:flex-end}.restart-comfy .restart-label{display:none}.restart-comfy{padding:7px}}@media(max-width:440px){.masonry-grid{column-count:1}}
  </style>
</head>
<body>
<main class="shell">
  <header class="topbar"><div class="brand"><div class="mark">✦</div><div><h1>Grok Studio</h1><p>媒体生成与素材库</p></div></div><div class="top-actions"><div class="health"><span class="dot" id="healthDot"></span><span id="healthText">检查服务中</span></div><button class="restart-comfy" id="restartComfy" type="button" title="重启 ComfyUI" aria-label="重启 ComfyUI"><span class="restart-icon" aria-hidden="true">↻</span><span class="restart-label">重启 ComfyUI</span></button><button class="restart-comfy" id="logout" type="button" title="退出登录">退出</button></div></header>
  <div class="grid">
    <section class="panel controls">
      <div class="section-title"><h2>创建媒体</h2><span class="badge" id="modeBadge">图片</span></div>
      <div class="workspace-tabs"><button class="workspace-tab active" data-page="grok" type="button">Grok</button><button class="workspace-tab" data-page="comfy" type="button">ComfyUI</button><button class="workspace-tab" data-page="generic" type="button">通用生图</button></div>
      <div class="mode-tabs" id="grokModes"><button class="tab active" data-mode="image" type="button">图片</button><button class="tab" data-mode="masonry" type="button">瀑布流生图</button><button class="tab" data-mode="video" type="button">生视频</button></div>
      <div class="mode-tabs comfy-modes" id="comfyModes" hidden><button class="tab" data-mode="comfy" type="button">文生图</button><button class="tab" data-mode="comfyEdit" type="button">图片编辑</button><button class="tab" data-mode="comfyVideo" type="button">生视频</button></div>
      <div class="mode-tabs generic-modes" id="genericModes" hidden><button class="tab" data-mode="generic" type="button">通用生图</button></div>
      <form id="form">
        <div class="field" id="modelField"><label>模型 <span class="hint">必填</span></label><input id="model" value="grok-imagine-image" required></div>
        <div class="field"><label>提示词 <span class="hint">描述想要的画面</span></label><textarea id="prompt" placeholder="例如：明亮工作室中的极简红色椅子" required></textarea></div>
        <div id="editFields"><div class="field"><label>原图公共 URL <span class="hint">可选，填写后自动进入编辑模式</span></label><div class="upload-line"><input id="imageUrl" placeholder="留空则生成图片"><button class="secondary" id="copyImageUrl" type="button">复制</button><label class="secondary" style="display:grid;place-items:center;cursor:pointer">上传<input id="imageFile" type="file" accept="image/*" hidden></label></div></div></div>
        <div id="imageFields"><div class="row"><div class="field"><label>数量</label><input id="count" type="number" min="1" max="4" value="1"></div><div class="field"><label>比例</label><select id="ratio"><option>1:1</option><option>16:9</option><option>9:16</option><option>4:3</option><option>3:2</option></select></div></div><div class="field"><label>分辨率</label><select id="resolution"><option>1k</option><option>2k</option></select></div></div>
        <div id="videoFields" hidden><div class="row"><div class="field"><label>时长（秒）</label><input id="duration" type="number" min="1" max="60" value="8"></div><div class="field"><label>比例</label><select id="videoRatio"><option>16:9</option><option>9:16</option><option>1:1</option></select></div></div><div class="field"><label>分辨率</label><select id="videoResolution"><option>720p</option><option>480p</option><option>1080p</option></select></div><div class="field"><label>首帧图片 URL <span class="hint">可选</span></label><input id="videoImage" placeholder="https://..."></div></div>
        <div id="comfyFields" hidden><div id="comfyEditFields" hidden><div class="field"><label>输入图片 <span class="hint">必填</span></label><div class="upload-line"><input id="comfyEditName" readonly placeholder="选择需要修改的图片"><label class="secondary" style="display:grid;place-items:center;cursor:pointer">选择<input id="comfyEditFile" type="file" accept="image/*" hidden></label></div></div></div><div id="comfyVideoFields" hidden><div class="field"><label>首帧图片 <span class="hint">可选，有图片时自动图生视频</span></label><div class="upload-line"><input id="comfyVideoName" readonly placeholder="未选择图片时使用文生视频"><label class="secondary" style="display:grid;place-items:center;cursor:pointer">选择<input id="comfyVideoFile" type="file" accept="image/*" hidden></label><button class="secondary" id="clearComfyVideoImage" type="button">清除</button></div></div><div class="row"><div class="field"><label>宽高比</label><select id="comfyVideoRatio"><option>1:1 (Square)</option><option>2:3 (Portrait Photo)</option><option>3:2 (Photo)</option><option>3:4 (Portrait Standard)</option><option>4:3 (Standard)</option><option selected>9:16 (Portrait Widescreen)</option><option>16:9 (Widescreen)</option><option>21:9 (Ultrawide)</option></select></div><div class="field"><label>百万像素</label><select id="comfyVideoMegapixels"><option>0.2</option><option>0.3</option><option selected>0.4</option><option>0.5</option><option>0.6</option><option>0.7</option><option>0.8</option><option>0.9</option><option>0.98</option><option>1.0</option><option>1.2</option><option>1.5</option><option>1.8</option><option>2.0</option></select></div></div><div class="field"><label>时长（秒） <span class="hint">最低 5 秒</span></label><input id="comfyVideoDuration" type="number" min="5" max="60" step="0.5" value="5"></div></div><div class="field" id="comfyNegativeField"><label>负向提示词 <span class="hint">可为空</span></label><textarea id="comfyNegative" placeholder="例如：模糊，低质量，变形"></textarea></div><div class="row" id="comfySizeFields"><div class="field"><label>宽度</label><input id="comfyWidth" type="number" min="1" max="8192" value="768"></div><div class="field"><label>高度</label><input id="comfyHeight" type="number" min="1" max="8192" value="1024"></div></div></div>
        <div id="genericFields" hidden><div class="provider-toolbar"><div class="field"><label>供应商</label><select id="genericProvider"></select></div><button class="secondary" id="manageProviders" type="button">管理</button></div><div class="field"><label>模型</label><select id="genericModel"></select></div><div class="field" id="genericEditSource"><label>输入图片 <span class="hint">可选，有图片时自动编辑</span></label><div class="upload-line"><input id="genericEditName" readonly placeholder="未选择图片时生成新图片"><label class="secondary" style="display:grid;place-items:center;cursor:pointer">选择<input id="genericEditFile" type="file" accept="image/*" hidden></label><button class="secondary" id="clearGenericImage" type="button">清除</button></div><input id="genericImageUrl" placeholder="也可以填写 https:// 图片地址" style="margin-top:8px"></div><div class="row"><div class="field"><label>尺寸</label><select id="genericSize"><option>1024x1024</option><option>1536x1024</option><option>1024x1536</option></select></div><div class="field"><label>数量</label><input id="genericCount" type="number" min="1" max="4" value="1"></div></div></div>
        <label class="check"><input id="stream" type="checkbox"> 使用扩展流式响应（图片）</label>
        <button class="primary" id="submit" type="submit">生成图片</button>
      </form>
    </section>
    <section class="panel result"><div class="result-head"><div><h2>本次结果</h2><p id="resultHint">生成后的图片会显示在这里</p></div><span class="badge" id="resultCount">0 项</span></div><div id="results" class="empty"><div><strong>还没有结果</strong><span>填写提示词，开始你的第一次创作</span></div></div></section>
  </div>
  <section class="panel library"><div class="library-head"><h2>素材库</h2><button class="danger" id="clearCurrent" type="button">清空全部</button></div><div class="filters"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="image">生成图片</button><button class="filter" data-filter="video">视频</button><button class="filter" data-filter="upload">ImgBB 上传</button><button class="danger" id="deleteSelected" type="button" disabled>删除选中</button></div><div id="libraryGrid"><div class="status">正在读取历史记录…</div></div></section>
</main><div class="toast" id="toast"></div><div class="provider-modal" id="providerModal" role="dialog" aria-modal="true" aria-label="供应商管理"><div class="provider-dialog"><div class="provider-dialog-head"><h2>供应商管理</h2><button class="secondary" id="closeProviders" type="button">关闭</button></div><div class="provider-dialog-body"><div><input id="providerId" type="hidden"><div class="field"><label>名称</label><input id="providerName" placeholder="OpenAI"></div><div class="field"><label>兼容 API 地址</label><input id="providerBaseUrl" placeholder="https://api.openai.com"></div><div class="field"><label>API Key <span class="hint">编辑时留空保留原 Key</span></label><input id="providerApiKey" type="password" autocomplete="new-password" placeholder="不会显示已保存的 Key"></div><div class="field"><label>模型列表 <span class="hint">逗号分隔</span></label><input id="providerModels" placeholder="gpt-image-1,dall-e-3"></div><div class="provider-form-actions"><button class="primary" id="saveProvider" type="button">新增供应商</button><button class="secondary" id="resetProvider" type="button">取消编辑</button></div></div><div><div class="provider-list" id="providerList"></div></div></div></div></div><div class="preview-modal" id="previewModal" role="dialog" aria-modal="true" aria-label="媒体预览"><button class="preview-close" id="closePreview" type="button" aria-label="关闭预览">×</button><div class="preview-modal-content" id="previewContent"></div></div>
<script>
  const $=id=>document.getElementById(id); let page='grok', mode='image', library=[], comfyEditImage=null, comfyVideoImage=null, genericEditImage=null, imageProviders=[];
  $('genericSize').innerHTML=['512x512','768x768','1024x1024','1024x768','768x1024','1536x1024','1024x1536','1280x720','720x1280','1920x1080','1080x1920'].map(size=>`<option${size==='1024x1024'?' selected':''}>${size}</option>`).join('');
  let genericWaitTimer=null;
  function hasGenericImage(){return Boolean(genericEditImage||$('genericImageUrl').value.trim())}
  function updateGenericAction(){if(page!=='generic')return;const editing=hasGenericImage();$('submit').textContent=editing?'编辑图片':'生成图片';$('resultHint').textContent=editing?'检测到输入图片，将调用编辑接口':'未提供输入图片，将调用生成接口'}
  function startGenericWait(){const provider=imageProviders.find(x=>x.id===$('genericProvider').value);const started=Date.now();$('results').className='status';$('results').innerHTML=`<div class="progress-box"><strong>${hasGenericImage()?'正在提交图片编辑':'正在生成图片'}</strong><div class="progress-line"><div class="progress-fill indeterminate"></div></div><div class="progress-label"><span>${escapeHtml(provider?.name||'供应商')} · ${escapeHtml($('genericModel').value||'模型')}</span><span id="genericWaitTime">已等待 0 秒</span></div></div>`;$('resultCount').textContent='处理中';$('resultHint').textContent='请求已发送，正在等待供应商返回结果';clearInterval(genericWaitTimer);genericWaitTimer=setInterval(()=>{const el=$('genericWaitTime');if(el)el.textContent=`已等待 ${Math.floor((Date.now()-started)/1000)} 秒`},1000)}
  function stopGenericWait(){clearInterval(genericWaitTimer);genericWaitTimer=null}
  function requestParams(options={}){if(!options.body)return {};if(typeof options.body==='string'){try{return JSON.parse(options.body)}catch{return {body:options.body.slice(0,1200)}}}return {body:`<binary ${options.body.byteLength||options.body.size||0} bytes>`}}

  function escapeHtml(value){return String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
  function masonryEntry(item,index){if(item.error)return `<article class="media-card"><div class="masonry-error"><strong>第 ${index+1} 张生成失败</strong><span>${escapeHtml(item.error)}</span></div></article>`;return card(item)}
  async function runMasonry(event){event.preventDefault();const button=$('submit');button.disabled=true;const prompt=$('prompt').value.trim();const payload={model:$('model').value.trim(),prompt,n:1,aspect_ratio:$('ratio').value,resolution:$('resolution').value,response_format:'url',stream:false};const entries=Array(6).fill(null);let done=0,success=0;const render=()=>{$('results').className='masonry-grid';const visible=entries.map((item,index)=>item?masonryEntry(item,index):'').join('');$('results').innerHTML=visible||'<div class="status">正在启动 6 个独立请求…</div>';$('resultCount').textContent=`${success} 成功 / ${done} 完成`;$('resultHint').textContent=`瀑布流任务：${done} / 6 完成`;bindPreviews()};render();const requestOne=async index=>{try{const response=await apiFetch('/api/images/generations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const body=await response.json();if(!response.ok)throw Error(responseError(body));const media=(body.data||[])[0];if(!media)throw Error('上游未返回图片');entries[index]={kind:'image',url:media.url,data_uri:media.b64_json?'data:image/png;base64,'+media.b64_json:'',prompt};success++}catch(error){entries[index]={error:error.message||'请求失败'}}finally{done++;render()}};await Promise.all(Array.from({length:6},(_,index)=>requestOne(index)));button.disabled=false;toast(`瀑布流完成：${success} 成功，${6-success} 失败`);await refresh()}
  const defaultSubmit=$('form').onsubmit;$('form').onsubmit=event=>mode==='masonry'?runMasonry(event):defaultSubmit(event);
  $('form').addEventListener('submit',async event=>{if(mode!=='comfyVideo')return;event.preventDefault();event.stopImmediatePropagation();const button=$('submit');button.disabled=true;$('results').className='status';$('results').innerHTML='<div class="progress-box"><strong>ComfyUI 视频任务正在提交</strong><div class="progress-line"><div class="progress-fill indeterminate"></div></div><div class="progress-label"><span>MiniMax H3</span><span>请稍候</span></div></div>';$('resultCount').textContent='处理中';const payload={workflow:comfyVideoImage?'image_to_video':'text_to_video',prompt:$('prompt').value.trim(),aspect_ratio:$('comfyVideoRatio').value,megapixels:Number($('comfyVideoMegapixels').value),duration:Number($('comfyVideoDuration').value)};if(comfyVideoImage)payload.image=comfyVideoImage;try{const r=await apiFetch('/api/comfyui/generations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const j=await r.json();if(!r.ok)throw Error(responseError(j));$('results').innerHTML='<div class="status"><div class="progress-box"><strong>ComfyUI 视频任务已提交</strong><div class="progress-line"><div class="progress-fill" style="width:10%"></div></div><div class="progress-label"><span>'+j.prompt_id+'</span><span>排队中</span></div></div></div>';toast(comfyVideoImage?'图生视频任务已提交':'文生视频任务已提交');if(j.task_id)pollComfyTask(j.task_id)}catch(error){$('results').className='empty';$('results').innerHTML=`<div><strong>请求未完成</strong><span>${error.message}</span></div>`;toast(error.message)}finally{button.disabled=false}},true);
  $('form').addEventListener('submit',()=>{if(page==='generic')mode=hasGenericImage()?'genericEdit':'generic'},true);
  $('form').addEventListener('submit',async event=>{if(mode!=='generic'&&mode!=='genericEdit')return;event.preventDefault();event.stopImmediatePropagation();const button=$('submit');button.disabled=true;const payload={provider_id:$('genericProvider').value,model:$('genericModel').value,prompt:$('prompt').value.trim(),n:Number($('genericCount').value),size:$('genericSize').value};if(mode==='genericEdit'){payload.image={url:$('genericImageUrl').value.trim()};if(!payload.image.url){toast('编辑时需要图片 URL');button.disabled=false;return}}try{const endpoint=mode==='genericEdit'?'/api/images/edits':'/api/images/generations';const response=await apiFetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const body=await response.json();if(!response.ok)throw Error(responseError(body));const data=(body.data||[]).map(x=>({kind:'image',url:x.url,data_uri:x.b64_json?'data:image/png;base64,'+x.b64_json:'',prompt:payload.prompt}));$('results').className='media-grid';$('results').innerHTML=data.length?data.map(card).join(''):'<div class="status">供应商未返回可展示的图片</div>';$('resultCount').textContent=data.length+' 项';bindPreviews();toast('通用生图完成');await refresh()}catch(error){$('results').className='empty';$('results').innerHTML=`<div><strong>请求未完成</strong><span>${error.message}</span></div>`;toast(error.message)}finally{button.disabled=false}},true);
  $('restartComfy').onclick=async()=>{if(!window.confirm('确定重启 ComfyUI 吗？正在执行的任务会被中断。'))return;const button=$('restartComfy');button.disabled=true;$('healthDot').classList.remove('on');$('healthText').textContent='ComfyUI 重启中';try{const response=await apiFetch('/api/comfyui/restart',{method:'POST'});const body=await response.json();if(!response.ok)throw Error(responseError(body,'ComfyUI 重启失败'));toast('ComfyUI 已开始重启');await new Promise(resolve=>setTimeout(resolve,3000));for(let attempt=0;attempt<30;attempt++){try{const health=await apiFetch('/api/comfyui/health');if(health.ok){$('healthDot').classList.add('on');$('healthText').textContent='ComfyUI 已恢复';toast('ComfyUI 已恢复在线');return}}catch{}await new Promise(resolve=>setTimeout(resolve,2000))}$('healthText').textContent='等待 ComfyUI 恢复';toast('重启已提交，ComfyUI 尚未恢复')}catch(error){$('healthText').textContent='ComfyUI 重启失败';toast(error.message)}finally{button.disabled=false}};
  $('logout').onclick=async()=>{try{await window.fetch('/api/auth/logout',{method:'POST'})}finally{window.location.replace('/')}};
  $('closePreview').onclick=()=>{$('previewModal').classList.remove('open');$('previewContent').innerHTML=''};$('previewModal').onclick=e=>{if(e.target===$('previewModal'))$('closePreview').click()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('providerModal').classList.contains('open'))$('closeProviders').click();else $('closePreview').click()}});
  apiFetch('/api/health').then(r=>r.json()).then(j=>{$('healthDot').classList.toggle('on',j.ok);$('healthText').textContent=j.configured?'服务在线':'服务在线 · 待配置上游'}).catch(()=>{$('healthText').textContent='服务不可用'});refresh();
</script>
</body></html>
