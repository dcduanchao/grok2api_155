<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 | Grok Studio</title>
  <style>
    :root{--ink:#17202a;--muted:#687483;--line:#dfe5ea;--paper:#f7f9fb;--card:#fff;--accent:#e85d3f}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(380px,100%);padding:28px;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 18px 50px rgba(28,44,60,.09)}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}.mark{width:40px;height:40px;display:grid;place-items:center;border-radius:8px;background:var(--accent);color:#fff;font-size:21px;font-weight:800}.brand h1{margin:0;font-size:19px}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}
    label{display:block;margin-bottom:7px;color:#4f5b67;font-size:12px;font-weight:700}input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;outline:none;font:inherit}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #e85d3f15}button{width:100%;margin-top:14px;padding:11px 14px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.error{min-height:21px;margin:10px 0 0;color:#b83d2d;font-size:12px}
  </style>
</head>
<body>
  <main>
    <div class="brand"><div class="mark">G</div><div><h1>Grok Studio</h1><p>媒体生成工作台</p></div></div>
    <form id="loginForm">
      <label for="password">访问密码</label>
      <input id="password" type="password" autocomplete="current-password" autofocus required>
      <button id="submit" type="submit">进入工作台</button>
      <p class="error" id="error" role="alert"></p>
    </form>
  </main>
  <script>
    document.getElementById('loginForm').onsubmit=async event=>{event.preventDefault();const button=document.getElementById('submit');const error=document.getElementById('error');button.disabled=true;error.textContent='';try{const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});const body=await response.json();if(!response.ok)throw new Error(body?.error?.message||'登录失败');window.location.replace('/')}catch(err){error.textContent=err.message;document.getElementById('password').select()}finally{button.disabled=false}};
  </script>
</body>
</html>
